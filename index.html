
<div id="drop-zone" style="border: 2px dashed #007bff; border-radius: 8px; padding: 30px; text-align: center; font-family: sans-serif; background: #f8f9fa;">
  <p id="status-text">Drag & drop your HTML file here, or click Browse</p>
  <input type="file" id="file-input" accept=".html,.htm" style="display: none;" />
  <button onclick="document.getElementById('file-input').click()" style="padding: 10px 18px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px;">Browse File</button>
  <br><br>
  <button id="open-btn" style="display: none; padding: 12px 20px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 15px; font-weight: bold;">Open About:Blank</button>
</div>

<script>
  let fileContent = "";
  const dropZone = document.getElementById("drop-zone");
  const fileInput = document.getElementById("file-input");
  const statusText = document.getElementById("status-text");
  const openBtn = document.getElementById("open-btn");

  // Prevent default drag behaviors
  ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
    dropZone.addEventListener(eventName, preventDefaults, false);
    document.body.addEventListener(eventName, preventDefaults, false);
  });

  function preventDefaults(e) {
    e.preventDefault();
    e.stderr = e.stopPropagation;
  }

  // Handle dropped files
  dropZone.addEventListener('drop', (e) => {
    const dt = e.dataTransfer;
    const files = dt.files;
    handleFile(files[0]);
  });

  // Handle browsed files
  fileInput.addEventListener('change', (e) => {
    if (e.target.files.length > 0) {
      handleFile(e.target.files[0]);
    }
  });

  function handleFile(file) {
    if (!file) return;
    statusText.innerText = `Loaded file: ${file.name}`;
    const reader = new FileReader();
    reader.onload = function(e) {
      fileContent = e.target.result;
      openBtn.style.display = 'inline-block';
    };
    reader.readAsText(file);
  }

  // Open in about:blank
  openBtn.addEventListener('click', () => {
    if (!fileContent) return;
    const newWin = window.open('about:blank', '_blank');
    if (newWin) {
      newWin.document.open();
      newWin.document.write(fileContent);
      newWin.document.close();
    } else {
      alert('Popup blocked! Please allow popups for this site.');
    }
  });
</script>
